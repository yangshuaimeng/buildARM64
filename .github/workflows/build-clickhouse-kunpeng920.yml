name: Build ClickHouse 24.3 for Kunpeng920

on:
  workflow_dispatch:
    inputs:
      clickhouse_version:
        description: 'ClickHouse version to build'
        required: true
        default: 'v24.3.13.40-lts'
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo
      compatibility_mode:
        description: 'Compatibility mode for older ARM CPUs'
        required: true
        default: 'safe'
        type: choice
        options:
          - safe
          - optimized

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Checkout ClickHouse
        uses: actions/checkout@v4
        with:
          repository: 'ClickHouse/ClickHouse'
          ref: ${{ github.event.inputs.clickhouse_version }}
          submodules: 'recursive'
          fetch-depth: 1
      
      - name: Create build script
        run: |
          cat > build.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "=== Installing dependencies ==="
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git cmake ninja-build \
              gcc g++ \
              python3 python3-pip \
              libssl-dev zlib1g-dev \
              libicu-dev libreadline-dev \
              ccache curl wget
        
          
          echo "=== Creating build directory ==="
          mkdir -p /build/output
          cd /build/ClickHouse
          rm -rf build
          mkdir build
          cd build
          
          echo "=== Configuring CMake for Kunpeng920 ==="
          if [ "$COMPAT_MODE" = "safe" ]; then
            echo "Using SAFE compatibility mode (ARMv8.0-A baseline)"
            CMAKE_FLAGS=(
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_CXX_COMPILER=g++
              -DENABLE_CLICKHOUSE_ALL=OFF
              -DENABLE_CLICKHOUSE_SERVER=ON
              -DENABLE_CLICKHOUSE_CLIENT=ON
              -DENABLE_CLICKHOUSE_LOCAL=ON
              -DARCH_NATIVE=OFF
              -DNO_ARMV81_OR_HIGHER=1
              -DCOMPILER_FLAGS="-march=armv8-a -mtune=generic"
              -DENABLE_MULTITARGET_CODE=OFF
              -DUSE_INTERNAL_SSL_LIBRARY=ON
              -DUSE_STATIC_LIBRARIES=ON
              -DCMAKE_INSTALL_PREFIX=/build/output
              -GNinja
            )
          else
            echo "Using OPTIMIZED mode (ARMv8.2-A with Kunpeng tuning)"
            CMAKE_FLAGS=(
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_CXX_COMPILER=g++
              -DENABLE_CLICKHOUSE_ALL=OFF
              -DENABLE_CLICKHOUSE_SERVER=ON
              -DENABLE_CLICKHOUSE_CLIENT=ON
              -DENABLE_CLICKHOUSE_LOCAL=ON
              -DARCH_NATIVE=OFF
              -DARM_MARCH="armv8.2-a"
              -DCOMPILER_FLAGS="-march=armv8.2-a -mtune=tsv110"
              -DUSE_INTERNAL_SSL_LIBRARY=ON
              -DUSE_STATIC_LIBRARIES=ON
              -DCMAKE_INSTALL_PREFIX=/build/output
              -GNinja
            )
          fi
          
          cmake .. "${CMAKE_FLAGS[@]}"
          
          echo "=== Building ClickHouse (this may take 1-2 hours) ==="
          # Limit parallel jobs to avoid OOM
          ninja -j 2 clickhouse-server clickhouse-client clickhouse-local
          
          echo "=== Collecting binaries ==="
          cp programs/clickhouse-server /build/output/
          cp programs/clickhouse-client /build/output/
          cp programs/clickhouse-local /build/output/
          
          echo "=== Verifying binaries ==="
          file /build/output/clickhouse-server
          /build/output/clickhouse-server --version
          
          echo "=== Creating archive ==="
          cd /build/output
          tar -czvf clickhouse-24.3-kunpeng920-${COMPAT_MODE}.tar.gz clickhouse-*
          
          echo "=== Build complete! ==="
          ls -lh clickhouse-24.3-kunpeng920-${COMPAT_MODE}.tar.gz
          EOF
          
          chmod +x build.sh
      
      - name: Build ClickHouse in ARM64 container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v $PWD:/build/ClickHouse \
            -v $PWD/build.sh:/build/build.sh \
            -e BUILD_TYPE=${{ github.event.inputs.build_type }} \
            -e COMPAT_MODE=${{ github.event.inputs.compatibility_mode }} \
            -w /build \
            ubuntu:22.04 \
            bash /build/build.sh
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-kunpeng920-${{ github.event.inputs.compatibility_mode }}
          path: build/output/clickhouse-24.3-kunpeng920-*.tar.gz
          retention-days: 30
      
      - name: Create Release (optional)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kunpeng920-${{ github.event.inputs.clickhouse_version }}-${{ github.event.inputs.compatibility_mode }}
          name: ClickHouse ${{ github.event.inputs.clickhouse_version }} for Kunpeng920
          body: |
            ClickHouse ${{ github.event.inputs.clickhouse_version }} compiled for Kunpeng920
            
            **Build Configuration:**
            - Compatibility Mode: ${{ github.event.inputs.compatibility_mode }}
            - Build Type: ${{ github.event.inputs.build_type }}
            - Target: ARMv8-A (safe mode) or ARMv8.2-A (optimized mode)
            
            **Installation:**
            ```bash
            tar -xzvf clickhouse-24.3-kunpeng920-${{ github.event.inputs.compatibility_mode }}.tar.gz
            sudo cp clickhouse-server /usr/bin/
            sudo cp clickhouse-client /usr/bin/
            sudo cp clickhouse-local /usr/bin/
            sudo chmod +x /usr/bin/clickhouse-*
            clickhouse-server --version
            ```
          files: build/output/clickhouse-24.3-kunpeng920-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
