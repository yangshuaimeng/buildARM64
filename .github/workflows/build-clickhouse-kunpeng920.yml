name: Build ClickHouse Server for Kunpeng920

on:
  workflow_dispatch:
    inputs:
      clickhouse_version:
        description: 'ClickHouse version (tag or hash)'
        required: true
        default: 'v24.3.13.40-lts'
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo
      compatibility_mode:
        description: 'Target Optimization'
        required: true
        default: 'optimized'
        type: choice
        options:
          - safe       # ARMv8.0-A (兼容性最强)
          - optimized  # ARMv8.2-A + LSE (Kunpeng 920 最佳性能)

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Add Swap Space
        run: |
          # 增加 12GB Swap 空间，防止链接时内存溢出
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Checkout ClickHouse
        uses: actions/checkout@v4
        with:
          repository: 'ClickHouse/ClickHouse'
          ref: ${{ github.event.inputs.clickhouse_version }}
          submodules: 'recursive'
          fetch-depth: 1

      - name: Build in ARM64 Container
        run: |
          # 创建输出目录
          mkdir -p output
          
          docker run --rm \
            --platform linux/arm64 \
            -v $PWD:/build/ClickHouse \
            -e BUILD_TYPE=${{ github.event.inputs.build_type }} \
            -e COMPAT_MODE=${{ github.event.inputs.compatibility_mode }} \
            -w /build/ClickHouse \
            ubuntu:22.04 \
            bash -c "
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                git cmake ninja-build clang lld python3 libssl-dev \
                zlib1g-dev libicu-dev libreadline-dev curl wget

              mkdir -p build_dir && cd build_dir

              echo '=== Configuring CMake ==='
              CMAKE_FLAGS=(
                -DCMAKE_BUILD_TYPE=\$BUILD_TYPE
                -DCMAKE_C_COMPILER=clang
                -DCMAKE_CXX_COMPILER=clang++
                -DCMAKE_LINKER=lld
                -DENABLE_CLICKHOUSE_ALL=OFF
                -DENABLE_CLICKHOUSE_SERVER=ON
                -DENABLE_CLICKHOUSE_CLIENT=OFF
                -DENABLE_CLICKHOUSE_LOCAL=OFF
                -DENABLE_CLICKHOUSE_KEEPER=OFF
                -DENABLE_LIBRARIES=OFF
                -DARCH_NATIVE=OFF
                -DUSE_STATIC_LIBRARIES=ON
                -DENABLE_MULTITARGET_CODE=OFF
                -GNinja
              )

              if [ \"\$COMPAT_MODE\" = \"safe\" ]; then
                CMAKE_FLAGS+=(-DNO_ARMV81_OR_HIGHER=1 -DCOMPILER_FLAGS=\"-march=armv8-a\")
              else
                # Kunpeng 920 特性优化: v8.2-a + LSE 原子锁增强
                CMAKE_FLAGS+=(-DARM_MARCH=armv8.2-a -DCOMPILER_FLAGS=\"-march=armv8.2-a+crypto+lse+rcpc\")
              fi

              cmake .. \"\${CMAKE_FLAGS[@]}\"

              echo '=== Building clickhouse-server (Limited to 2 threads to save RAM) ==='
              ninja -j 2 clickhouse-server

              echo '=== Packaging ==='
              cp programs/clickhouse-server /build/ClickHouse/output/
              cd /build/ClickHouse/output/
              tar -czvf clickhouse-server-kunpeng920-\$COMPAT_MODE.tar.gz clickhouse-server
            "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-server-kunpeng920-${{ github.event.inputs.compatibility_mode }}
          path: output/*.tar.gz
          retention-days: 7

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: clickhouse-${{ github.event.inputs.clickhouse_version }}-kunpeng
          name: ClickHouse ${{ github.event.inputs.clickhouse_version }} for Kunpeng920
          body: |
            Built for Kunpeng 920 (ARM64).
            - **Binary**: `clickhouse-server`
            - **Mode**: ${{ github.event.inputs.compatibility_mode }}
            - **Compiler**: Clang + LLD
          files: output/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
